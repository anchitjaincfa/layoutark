name: CI
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Forbidden scope tripwire
        run: |
          ! grep -R -E "sendBeacon|XMLHttpRequest|WebSocket" app src/components
          ! grep -R -E "upload your .pub|create account|online converter" app src/components
